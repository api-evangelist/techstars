aid: techstars
name: Techstars
description: >-
  Techstars is a global pre-seed startup accelerator and investor founded in 2006 by David Cohen, Brad
  Feld, David Brown, and Jared Polis in Boulder, Colorado, and headquartered in New York City. Operating a
  worldwide network of mentorship-driven accelerator programs across cities including Boulder, Boston,
  Chicago, New York, London, and Tokyo, Techstars runs an intensive three-month program that provides each
  accepted company roughly $220,000 in capital — a $20,000 convertible equity agreement for a minimum 5%
  of common stock plus an optional $200,000 uncapped MFN post-money SAFE (Asia-Pacific programs at
  ~$100,000). The firm is largely sector-agnostic but is especially active in AI/ML, fintech, SaaS,
  developer tools, healthcare, climate, space and defense, and critical infrastructure, and operates on its
  signature "Give First" philosophy. Techstars has backed more than 10,000 founders, producing dozens of
  unicorns and notable companies including Twilio, SendGrid, DigitalOcean, Uber, Remitly, Chainalysis,
  ClassPass, DataRobot, and PillPack, with portfolio companies collectively raising tens of billions in
  follow-on capital.
